<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div>
        <h2>User Dashboard</h2>
        <div id="userContent" class="success"></div>
        <div id="error" class="error"></div>
        <button id="logoutButton">Logout</button>
    </div>

    <script>
        (async () => {
            const token = localStorage.getItem('jwt');
            const userContent = document.getElementById('userContent');
            const errorDiv = document.getElementById('error');

            if (!token) {
                errorDiv.textContent = 'No JWT found. Please login.';
                userContent.textContent = '';
                return;
            }

            try {
                const response = await fetch('/hello', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.ok) {
                    const result = await response.text();
                    userContent.textContent = result;
                    errorDiv.textContent = '';
                } else {
                    errorDiv.textContent = 'Access denied: ' + response.status;
                    userContent.textContent = '';
                }
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
                userContent.textContent = '';
            }
        })();

        document.getElementById('logoutButton').addEventListener('click', async () => {
            const token = localStorage.getItem('jwt');
            const errorDiv = document.getElementById('error');

            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.ok) {
                    localStorage.removeItem('jwt');
                    window.location.href = '/login';
                } else {
                    errorDiv.textContent = 'Logout failed: ' + response.status;
                }
            } catch (err) {
                errorDiv.textContent = 'Logout error: ' + err.message;
            }
        });
    </script>
</body>
</html>
